services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft_server
    restart: unless-stopped
    ports:
      - '00000:00000' # Java Edition
      - '11111:11111/udp' # Bedrock Edition
    environment:
      SEED: '-6680189818125979617'
      EULA: 'TRUE'
      TYPE: 'PURPUR'
      MEMORY: '8G'
      ONLINE_MODE: 'FALSE'
      ENABLE_GEYER: 'true'
      ENABLE_FLOODGATE: 'true'
      ENABLE_RCON: 'true'
      RCON_PASSWORD: 'password'
    volumes:
      - './mc-data:/data'
